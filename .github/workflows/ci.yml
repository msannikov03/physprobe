name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-probe.txt
      - name: Install the CPU probe requirements
        run: pip install -r requirements-probe.txt pytest
      - name: I/O and end-to-end pipeline tests (CPU, synthetic data)
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "2"
        run: python -m pytest tests/test_io.py tests/test_pipeline.py -q
